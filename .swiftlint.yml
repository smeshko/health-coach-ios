# SwiftLint configuration — conservative starter set. Run via `make lint` (uses --strict, so any
# warning fails). Pinned tool version recorded in README.md.

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData

disabled_rules:
  # SwiftFormat owns comma style (it adds trailing commas in multiline collections); letting
  # SwiftLint also police them would make `make format` and `make lint` disagree.
  - trailing_comma
  # TODO/FIXME notes are allowed during early development.
  - todo

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

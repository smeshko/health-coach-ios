# SwiftLint configuration — conservative starter set. Run via `make lint` (uses --strict, so any
# warning fails). Pinned tool version recorded in README.md.

included:
  # The whole package source tree now lives under Sources/, organized into the layer/module folders
  # Repositories/ Clients/ Features/ Models/ Core/ DesignSystem/ (each module's tests are co-located
  # under its own Tests/ subfolder), so linting Sources/ covers both library and test code.
  - Sources

excluded:
  - .build
  - DerivedData

disabled_rules:
  # SwiftFormat owns comma style (it adds trailing commas in multiline collections); letting
  # SwiftLint also police them would make `make format` and `make lint` disagree.
  - trailing_comma
  # TODO/FIXME notes are allowed during early development.
  - todo

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  # `id` is the SwiftLint default exception; `db` is GRDB's idiomatic Database-handle closure
  # parameter, used pervasively in the persistence layer. `sm`/`md`/`lg` are the design-system
  # size-token vocabulary (e.g. `IconBadge.Size`), intentionally two letters.
  excluded:
    - id
    - db
    - sm
    - md
    - lg
